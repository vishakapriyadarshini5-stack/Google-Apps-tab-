<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Drawer</title>

  <style>

    /* ================================
       RESET
    ================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    /* ================================
       PAGE
    ================================= */

    body {
      min-height: 100vh;

      font-family:
        Inter,
        "Segoe UI",
        system-ui,
        sans-serif;

      color: #eeeeee;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(90, 100, 150, 0.18),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 75%,
          rgba(100, 80, 140, 0.14),
          transparent 35%
        ),
        #0b0c10;

      padding: 45px;

      overflow-x: hidden;
    }


    /* ================================
       BACKGROUND ATMOSPHERE
    ================================= */

    body::before,
    body::after {
      content: "";

      position: fixed;

      width: 420px;
      height: 420px;

      border-radius: 50%;

      filter: blur(100px);

      pointer-events: none;

      z-index: -1;
    }

    body::before {
      background: rgba(90, 110, 180, 0.10);

      top: -180px;
      left: -120px;

      animation: driftOne 18s ease-in-out infinite;
    }

    body::after {
      background: rgba(150, 100, 180, 0.08);

      bottom: -180px;
      right: -120px;

      animation: driftTwo 22s ease-in-out infinite;
    }


    @keyframes driftOne {

      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(80px, 50px);
      }

    }


    @keyframes driftTwo {

      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-70px, -40px);
      }

    }


    /* ================================
       MAIN DRAWER
    ================================= */

    .drawer {

      max-width: 1100px;

      min-height:
        calc(100vh - 90px);

      margin: auto;

      display: flex;
      flex-direction: column;

    }


    /* ================================
       HEADER
    ================================= */

    .header {

      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 35px;

    }


    .title {

      font-size: 40px;

      font-weight: 650;

      letter-spacing: -1.8px;

    }


    .subtitle {

      margin-top: 6px;

      color: #858994;

      font-size: 14px;

    }


    /* ================================
       APP AREA
    ================================= */

    .apps {

      display: flex;

      gap: 14px;

      flex-wrap: wrap;

    }


    /* ================================
       GLASS APP CARDS
    ================================= */

    .app {

      text-decoration: none;

      color: inherit;

      min-width: 155px;

      padding: 18px 22px;

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.055);

      border:
        1px solid rgba(255, 255, 255, 0.09);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      box-shadow:
        inset 0 1px 0
        rgba(255, 255, 255, 0.035);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        border 0.25s ease,
        box-shadow 0.25s ease;

    }


    .app:hover {

      transform:
        translateY(-4px);

      background:
        rgba(255, 255, 255, 0.085);

      border:
        1px solid rgba(255, 255, 255, 0.15);

      box-shadow:
        0 15px 45px
        rgba(0, 0, 0, 0.25);

    }


    .app-name {

      font-size: 15px;

      font-weight: 600;

    }


    .app-description {

      margin-top: 5px;

      font-size: 12px;

      color: #858994;

    }


    /* ================================
       BIG EMPTY CALM AREA
    ================================= */

    .calm-space {

      flex: 1;

      min-height: 320px;

      display: flex;

      align-items: center;
      justify-content: center;

      position: relative;

      overflow: hidden;

    }


    /* ================================
       FLOATING GLASS ORB
    ================================= */

    .orb {

      width: 125px;
      height: 125px;

      border-radius: 50%;

      background:

        radial-gradient(
          circle at 32% 28%,
          rgba(255,255,255,0.20),
          rgba(150,160,190,0.07) 45%,
          rgba(255,255,255,0.015) 70%
        );

      border:
        1px solid rgba(255,255,255,0.08);

      box-shadow:

        0 0 80px
        rgba(130, 140, 190, 0.12),

        inset 0 0 35px
        rgba(255,255,255,0.025);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);

      animation:
        float 7s ease-in-out infinite;

    }


    .orb::before {

      content: "";

      position: absolute;

      width: 210px;
      height: 210px;

      border-radius: 50%;

      border:
        1px solid rgba(255,255,255,0.035);

      transform:
        translate(-43px, -43px);

    }


    .orb::after {

      content: "";

      position: absolute;

      width: 280px;
      height: 280px;

      border-radius: 50%;

      border:
        1px solid rgba(255,255,255,0.018);

      transform:
        translate(-78px, -78px);

    }


    @keyframes float {

      0%, 100% {
        transform:
          translateY(0px)
          rotate(0deg);
      }

      50% {
        transform:
          translateY(-15px)
          rotate(2deg);
      }

    }


    /* ================================
       SECTION TITLE
    ================================= */

    .section-title {

      font-size: 13px;

      font-weight: 600;

      color: #858994;

      margin-bottom: 14px;

      letter-spacing: 0.4px;

    }


    /* ================================
       ADD BUTTON
    ================================= */

    .add-button {

      border:
        1px dashed
        rgba(255,255,255,0.16);

      background:
        rgba(255,255,255,0.025);

      color: #858994;

      border-radius: 18px;

      padding: 18px 22px;

      font-family: inherit;

      font-size: 14px;

      cursor: pointer;

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      transition:
        background 0.25s ease,
        border 0.25s ease,
        transform 0.25s ease;

    }


    .add-button:hover {

      background:
        rgba(255,255,255,0.065);

      border:
        1px dashed
        rgba(255,255,255,0.25);

      transform:
        translateY(-3px);

    }


    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 650px) {

      body {
        padding: 25px;
      }

      .title {
        font-size: 32px;
      }

      .app {
        flex: 1;
        min-width: 120px;
      }

    }

  </style>

</head>


<body>


  <main class="drawer">


    <!-- HEADER -->

    <header class="header">

      <div>

        <h1 class="title">
          Drawer
        </h1>

        <p class="subtitle">
          Your little digital space.
        </p>

      </div>

    </header>


    <!-- GOOGLE WORK APPS -->

    <section>

      <div class="apps">


        <a
          class="app"
          href="https://docs.google.com"
          target="_blank"
        >

          <div class="app-name">
            Google Docs
          </div>

          <div class="app-description">
            Documents
          </div>

        </a>


        <a
          class="app"
          href="https://sheets.google.com"
          target="_blank"
        >

          <div class="app-name">
            Google Sheets
          </div>

          <div class="app-description">
            Spreadsheets
          </div>

        </a>


        <a
          class="app"
          href="https://slides.google.com"
          target="_blank"
        >

          <div class="app-name">
            Google Slides
          </div>

          <div class="app-description">
            Presentations
          </div>

        </a>
        <a
  class="app"
  href="https://keep.google.com"
  target="_blank"
>
  <div class="app-name">
    Google Keep
  </div>

  <div class="app-description">
    Notes & ideas
  </div>
</a>


      </div>

    </section>


    <!-- CALM SPACE -->

    <section class="calm-space">

      <div class="orb"></div>

    </section>


    <!-- OTHER WORK APPS -->

    <section>

      <div class="section-title">
        Other work apps
      </div>


      <div class="apps">


        <!-- GITHUB -->

        <a
          class="app"
          href="https://github.com"
          target="_blank"
        >

          <div class="app-name">
            GitHub
          </div>

          <div class="app-description">
            Code & projects
          </div>

        </a>


        <!-- GOOGLE TASKS -->

<a
  class="app"
  href="https://tasks.google.com"
  target="_blank"
>
  <div class="app-name">
    Google Tasks
  </div>

  <div class="app-description">
    To-do list
  </div>
</a>

        <!-- WHATSAPP -->

        <a
          class="app"
          href="https://web.whatsapp.com"
          target="_blank"
        >

          <div class="app-name">
            WhatsApp
          </div>

          <div class="app-description">
            Messages
          </div>

        </a>


        <!-- ADD APP -->

        <button
          class="add-button"
          onclick="addApp()"
        >

          ＋ Add app / URL

        </button>


      </div>

    </section>


  </main>


  <!-- ================================
       JAVASCRIPT
  ================================= -->

  <script>

    function addApp() {

      const name =
        prompt("What should the app be called?");

      if (!name) {
        return;
      }


      const url =
        prompt("Paste the website URL:");

      if (!url) {
        return;
      }


      alert(
        "Nice! " +
        name +
        " will be added properly in the next version."
      );

    }

  </script>


</body>
</html>
